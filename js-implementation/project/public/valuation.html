<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRISM</title>
  <link rel="stylesheet" href="valuation.css">
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>

  <div class="main">
      <div class ="content">
         <div class="box1">
            <h1 class="box1_title">Reports</h1>
            <p class="box1_sub">Insight across your inventory operations</p>
            <div class="date">
               <label for="date">From: </label>
               <input type="date" id="date1">

               <label for="date">To: </label>
               <input type="date" id="date2">
            </div>
          <nav class="tab-choices">
               <a href="low_stock.html" class="tab">Low Stock</a>
               <a href="valuation.html" class="tab current">Valuation</a>
               <a href="movement_ledger.html" class="tab">Movement Ledger</a>
               <a href="top_movers.html" class="tab">Top Movers</a>
            </nav>
        </div>
      <div class="box2">
            <div class="box2_left">
            <h4 class="box2_title">Inventory Valuation</h4>
            <p class="box2_sub">Sum of (unit cost × current quantity) per categor</p>
            </div>
            <div class="box2_right">
               <button class="excel">CSV</button>
            </div>
         </div>

         <div class="box3">
          <div class="low-table">
            <table>
               <thead>
               <tr>
                  <th>Category</th>
                  <th>Value</th>
               </tr>
               </thead>
               <tbody>
               <tr>
                  <td>Dry Goods</td>
                  <td>Php 602.00</td>
               </tr>
               <tr>
                <td>Beverages</td>
                <td>Php 408.00</td>
              </tr>
              <tr>
                <td>Snacks</td>
                <td>Php 289.00</td>
              </tr>
              <tr>
                <td>Cleaning</td>
                <td>Php 84.00</td>
              </tr>
               </tbody>
               <tfoot>
                <tr>
                  <td>Total</td>
                  <td>Php 1,403.00</td>
                </tr>
               </tfoot>
            </table>
         </div>
       </div>
      </div>
  </div>
  <script src="script.js"></script>
    <script>
       window.onload = function() {   
        loadMenu().then(() => {
        document.querySelector('nav a[href="valuation.html"]').classList.add('active');
        });
        };
    </script>
</body>
</html>
