<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PRISM | Inventory Management</title>
        <link rel="stylesheet" href="users.css">
        <link rel="stylesheet" href="sidebar.css">
        <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
    </head>
    <body>
        <div class="main">
            <div class="content">

                <div class="action-bar">
                    <div class="page-header">
                    <h1 class="page-title">Users</h1>
                    <p class="page-subtitle">Manage your Employees</p>
                </div>
                    <div class="search-and-button-group">
                            <div class="search-container">
                                <span class="search-icon">🔍</span>
                                <input type="text" placeholder="Search by Username" class="search-input">  
                            </div>
                            <button class="create-btn">
                                <span class="plus-icon">👤+</span> Create Account
                            </button>
                        </div>
                    </div>

                    <div class="table-container">
                        <div class="users-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Jessica Tiamsim</td>
                                    <td>jc_admin@gmail.com</td>
                                    <td>Admin</td>
                                </tr>
                                <tr>
                                    <td>Wren Lacsamana</td>
                                    <td>wren_staff@gmail.com</td>
                                    <td>Staff</td>
                                </tr>
                                <tr>
                                    <td>Renzo Areta</td>
                                    <td>renzo_staff@gmail.com</td>
                                    <td>Staff</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                 </div>
            </div>
        </div>
    <div class="modal-overlay" id="newUserOverlay">
        <div class="modal-content">
            <h2 class="modal-title">Create Account</h2>
            <form id="userForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-input" required placeholder="Enter Full Name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" required placeholder="example@gmail.com">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" required placeholder="......">
                </div>

                <div class="form-group">
                    <label for="role">System Role</label>
                    <select id="role" class="form-select">
                        <option value="Staff">Staff</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="cancel-btn" id="closeUserOverlay">Cancel</button>
                    <button type="submit" class="add-btn">Add Employee</button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
       window.onload = function() {   
        loadMenu().then(() => {
        document.querySelector('nav a[href="users.html"]').classList.add('active');
        userModal();
        }).catch(err => {
        userModal();
        });
        };
    </script>
    </body>
</html>
