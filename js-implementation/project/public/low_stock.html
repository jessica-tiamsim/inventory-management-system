<!DOCTYPE html>
<html lang = "en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>PRISM</title>
   <link rel="stylesheet" href="low_stock.css">
   <link rel="stylesheet" href="sidebar.css">
    <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
</head>
<body>
   <div class="main">
      <div class ="content">
         <div class="box1">
            <h1 class="box1_title">Reports</h1>
            <p class="box1_sub">Insight across your inventory operations</p>
            <div class="date">
               <label for="date">From: </label>
               <input type="date" id="date1">

               <label for="date">To: </label>
               <input type="date" id="date2">
            </div>
            <nav class="tab-choices">
               <a href="low_stock.html" class="tab current">Low Stock</a>
               <a href="valuation.html" class="tab">Valuation</a>
               <a href="movement_ledger.html" class="tab">Movement Ledger</a>
               <a href="top.movers.html" class="tab">Top Movers</a>
            </nav>
         </div>

         <div class="box2">
            <div class="box2_left">
            <h4 class="box2_title">Low Stock Report</h4>
            <p class="box2_sub">Active products at or below their reorder threshold</p>
            </div>
            <div class="box2_right">
                  <button class="excel">CSV</button>
               </div>
            </div>

         <div class="box3">
          <div class="low-table">
            <table>
               <thead>
               <tr>
                  <th>SKU</th>
                  <th>Product</th>
                  <th>Country</th>
                  <th>Quantity</th>
                  <th>Reorder Threshold</th>
                  <th>Supplier Name</th>
               </tr>
               </thead>
               <tbody>
               <tr>
                  <td>BEV-006</td>
                  <td>Pocari Sweat</td>
                  <td>Bottled Water</td>
                  <td>7</td>
                  <td>Reorder Threshold</td>
                  <td>Alex Reyes</td>
               </tr>
               </tbody>
            </table>
         </div>
       </div>
     </div>
   </div>
</div>
  <script src="script.js"></script>
    <script>
       window.onload = function() {   
        loadMenu().then(() => {
        document.querySelector('nav a[href="low_stock.html"]').classList.add('active');
        low_stock(); 
        });
        };
    </script>
 </body>
</html>
