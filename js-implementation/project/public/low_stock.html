<!DOCTYPE html>
<html lang = "en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>PRISM</title>
   <link rel="stylesheet" href="low_stock.css">
   <link rel="stylesheet" href="sidebar.css">
    <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
</head>
<body>
   <div class="main">
      <div class ="content">
         <div class="box1">
            <h1>Reports</h1>
            <p class="box1_sub">Insight across your inventory operations</p>
            <div class="date">
               <label for="date">From: </label>
               <input type="date" id="date1">

               <label for="date">To: </label>
               <input type="date" id="date2">
            </div>
            <div class="choices">
               <span class="active">Low Stock</span>
               <span>Valuation</span>
               <span>Movement Ledger</span>
               <span>Top Movers</span>
            </div>
         </div>

         <div class="box2">
            <div class="box2_left">
            <h4>Low Stock Report</h4>
            <p class="box2_sub">Active products at or below their reorder threshold</p>
            </div>
            <div class="box2_right">
                  <button class="excel">CSV.</button>
               </div>
            </div>

         <div class="box3">
            <table>
               <tr class="header-box">
                  <th>SKU</th>
                  <th>Product</th>
                  <th>Country</th>
                  <th>Quantity</th>
                  <th>Reorder Threshold</th>
                  <th>Supplier Name</th>
               </tr>
               <tr>
                  <td>BEV-006</td>
                  <td>Pocari Sweat</td>
                  <td>Bottled Water</td>
                  <td>7</td>
                  <td>Reorder Threshold</td>
                  <td>Alex Reyes</td>
               </tr>
            </table>
         </div>
      </div>
   </div>
  </div>
</div>
  <script src="script.js"></script>
    <script>
       window.onload = function() {   
        loadMenu().then(() => {
        document.querySelector('nav a[href="low_stock.html"]').classList.add('active');
        low_stock(); 
        });
        };
    </script>
 </body>
</html>
