<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISM | Inventory Management</title>
    <link rel="stylesheet" href="product.css">
    <link rel="stylesheet" href="sidebar.css">
    <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
</head>
<body>

    <div class="main">
    <div class="content">
            <div class="content-box">
                <div class="content-header">
                    <div>
                        <h1>Products</h1>
                        <p>Manage Your Catalog and Stock Threshold</p>
                    </div>
                    <button class="btn-new"> + New Product</button>
                </div>


                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>SKU</th>
                                <th>PRODUCT NAME</th>
                                <th>CATEGORY</th>
                                <th>STATUS</th>
                                <th>ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>BEV-001</td>
                                <td>Coca-Cola</td>
                                <td>Carbonated</td>
                                <td class="status-active">Active</td>
                                <td>
                                    <img src="edit_icon.png" class="action-img">
                                    <img src="delete_icon.png" class="action-img">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        window.onload = function() {
       loadMenu().then(() => {
        document.querySelector('nav a[href="product.html"]').classList.add('active');
        product(); 
        });
        };
    </script>
</body>
</html>
