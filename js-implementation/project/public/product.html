<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISM | Inventory Management</title>
    <link rel="stylesheet" href="product.css">
    <link rel="stylesheet" href="sidebar.css">
    <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
</head>
<body>

    <div class="main">
    <div class="content">
            <div class="content-box">
                <div class="content-header">
                    <div>
                        <h1>Products</h1>
                        <p>Manage Your Catalog and Stock Threshold</p>
                        <div class="search-container">
                            <input type="text" placeholder="Search by Product Name or SKU" class="search-product">
                            <select name="categoryDropDown" id="category">
                            <option value="allCategories">All Categories</option>
                            <option value="category1">Carbonated</option>
                            <option value="category2">Energy Drink</option>
                            <option value="category3">Alcholic</option>
                            </select>
                            <select name="activeDropDown" id="active">
                            <option value="activeChoice">Active</option>
                            <option value="active1">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn-new" id="openModalBtn"> + New Product</button>
                </div>

                <div class="table-border">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>SKU</th>
                                <th>PRODUCT NAME</th>
                                <th>CATEGORY</th>
                                <th>STATUS</th>
                                <th>ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>BEV-001</td>
                                <td>Coca-Cola</td>
                                <td>Carbonated</td>
                                <td class="status-active">Active</td>
                                <td>
                                    <img src="edit_icon.png" class="action-img">
                                    <img src="delete_icon.png" class="action-img">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                </div>
            </div>
        </div>
    </div>
     <div class="modal-overlay" id="newProductModal">
        <div class="modal-content">
            <button type="button" class="close-btn" id="closeModalBtn">&times;</button>
            
            <h2>Details</h2>
            <p class="modal-subtitle">Add new SKU to your catalog.</p>

            <form id="productForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>SKU</label>
                        <input type="text" required>
                        <small class="input-hint">3-20 alphanumeric characters. Immutable once set.</small>
                    </div>

                    <div class="form-group">
                        <label>Category</label>
                        <select required>
                            <option value="">Select</option>
                            <option value="Carbonated">Carbonated</option>
                        </select>
                    </div>

                    <div class="form-group half-width">
                        <label>Name</label>
                        <input type="text" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Description</label>
                        <textarea></textarea>
                    </div>

                    <div class="form-group">
                        <label>Unit Price</label>
                        <input type="number" id="unitPrice" placeholder="0.00" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label>Unit Cost</label>
                        <input type="number" id="unitCost" placeholder="0.00" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label>Reorder Threshold</label>
                        <input type="number" id="reorderThreshold" placeholder="0" required>
                    </div>

                    <div class="form-group">
                        <label>Supplier Name</label>
                        <input type="text" id="supplierName" required>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn-save">Create Product</button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        window.onload = function() {
       loadMenu().then(() => {
        document.querySelector('nav a[href="product.html"]').classList.add('active');
        productModal();
       }).catch(err => {
        productModal();
        });
        };
    </script>
</body>
</html>
