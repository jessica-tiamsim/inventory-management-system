<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width, initial-scale=1.0">
        <title>PRISM</title>
        <link rel="stylesheet" href="global.css">
        <link rel="stylesheet" href="login-error.css">
    </head>
    <body>
        <div class="login_screen">
            <div class = "logo_div">
                
                <img src="image.png" class = "prism_img">
                    <h1 class = "logo_text">PRISM</h1>
            </div>
            
            <div class="login_card">
                <img src="image.png" class = "error_img">
                <h2>Log In Error</h2>
                    <p class='error_message'>A critical system error is preventing new <br> login this time.
                    Please try again later or <br>contact an admin.</p>
                    <button type="submit" class="btn-retry">Retry Login</button>
                </div>
            </div>  
        </div>
    </body>
</html>
