<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISM Web App</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div id="login-screen">
        <div class="logo-area">
            <img src="../../../assets/logo.png" class="main-logo" alt="PRISM Logo">
            <h1 style="letter-spacing: 2px; margin: 0;">PRISM</h1>
        </div>

        <div class="login-card">
            <h2>Log in</h2>
            <form id="loginForm">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>

                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>

                <button type="submit">Log in</button>
            </form>

            <div id="message" style="margin-top: 10px; font-weight: bold; text-align: center;"></div>

            <div class="alert-box" style="margin-top: 15px;">
                <strong>Restricted access.</strong><br>
                All login attempts are logged and monitored.
            </div>
        </div>
     </div>

     <script src="../script/script.js"></script>
     
     </body>
</html>
