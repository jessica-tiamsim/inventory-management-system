<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISM Web App</title>
    <style>
        :root {
            --gold: #FFBF00;
            --maroon: #801B32;
            --maroon-grad: linear-gradient(180deg, #801B32 0%, #5A1424 100%);
            --white: #FFFFFF;
            --shadow: #F5F5F5;
            --font-main: 'Inter', 'Roboto', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background: var(--maroon-grad);
            height: 100vh;
            overflow: hidden;
        }

        /* Logo Styling */
        .main-logo {
            width: 80px; 
            height: auto;
            margin: 0 auto 10px auto;
            display: block;
        }

        /* Login Screen Layout */
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .logo-area { text-align: center; color: white; margin-bottom: 20px; }

        .login-card {
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 350px;
        }

        .login-card h2 { color: var(--maroon); text-align: center; margin-top: 0; }
        label { display: block; font-size: 12px; color: #666; margin: 10px 0 5px; }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fcfcfc;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            background: var(--gold);
            color: black;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.98); }

        .alert-box {
            background: #FFF5F5;
            border: 1px solid #FFEBEB;
            color: #D32F2F;
            padding: 12px;
            font-size: 11px;
            border-radius: 8px;
            margin-top: 20px;
            line-height: 1.4;
        }

        /* Dashboard Layout */
        #dashboard-screen {
            display: none; 
            grid-template-columns: 250px 1fr;
            grid-template-rows: 60px 1fr;
            height: 100vh;
        }

        .sidebar { grid-row: 1 / 3; background: var(--maroon); color: white; padding: 20px; }
        .header { background: #FF9999; display: flex; align-items: center; padding: 0 20px; font-weight: bold; }
        .main-body { background: #A9A9A9; padding: 25px; }
        .content-white-box { background: white; height: 100%; border-radius: 4px; padding: 20px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="logo-area">
            <img src="image.png" alt="PRISM Logo" class="main-logo">
            <h1 style="letter-spacing: 2px; margin: 0;">PRISM</h1>
        </div>

        <div class="login-card">
            <h2>Log in</h2>
            <form id="loginForm">
                <label>Email</label>
                <input type="text" id="userIn" placeholder="Enter your mail" required>
                
                <label>Password</label>
                <input type="password" id="passIn" placeholder="Enter Password" required>
                
                <button type="submit">Log in</button>
            </form>

            <div class="alert-box">
                <strong>Restricted access.</strong><br>
                All login attempts are logged and monitored.
            </div>
        </div>
    </div>

    <div id="dashboard-screen">
        <aside class="sidebar">
            <img src="image_009de1.png" alt="PRISM Logo" style="width: 40px; margin-bottom: 20px;">
            <h3>PRISM</h3>
            <p style="opacity: 0.7; font-size: 14px;">Navigation Sidebar</p>
        </aside>
        <header class="header">Header inside body</header>
        <main class="main-body">
            <div class="content-white-box">
                <h2>Content Area</h2>
                <p>Authentication successful. Authorization enforced.</p>
                <button onclick="location.reload()" style="width: auto; padding: 10px 20px;">Logout</button>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('userIn').value;
            const pass = document.getElementById('passIn').value;

            if(user === "admin@prism.com" && pass === "password123") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'grid';
                document.body.style.background = "#fff"; 
            } else {
                alert("Use jc_admin@prism.com / password1217 to enter.");
            }
        });
    </script>
</body>
</html>
