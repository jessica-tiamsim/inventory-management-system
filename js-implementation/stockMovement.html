<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRISM</title>
  <link rel="stylesheet" href="stockMovement.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <h2 class="logo">
        <img src="image.png" alt="PRISM Logo">
        <div>
            <span>PRISM<p class="subtitle">Admin Portal</p></span>
        </div>
    </h2>
   
    <!-- NAVIGATION -->
    <nav>

      <a href="#" class="nav-item">
        Dashboard
      </a>

      <a href="#" class="nav-item">
        Products
      </a>

      <a href="#" class="nav-item active">
        Stock Movements
      </a>

      <a href="#" class="nav-item">
        Reports
      </a>

      <a href="#" class="nav-item">
        Profile
      </a>

    </nav>

    <!-- USER -->
    <div class="user-panel">
      <p>Admin User</p>
      <button>Logout</button>
    </div>

  </aside>

  <!-- MAIN -->
  <div class="main">

    <!-- HEADER -->
    <header class="topbar">
      <h1>PRISM | Inventory Management</h1>
    </header>

    <!-- BREADCRUMB -->
    <div class="breadcrumb">
      PRISM / Inventory / Stock Movements
    </div>

    <!-- CONTENT -->
    <main class="titleBlock">
       <div class="box1">
            <div class="title-group">
                <span class="pageTitle">Stock Movements</span>
                <p class="pageSubtitle">
                    Immutable ledger of stock change.
                </p>
                <div class="dropdowns">
                    <select name="productDropDown" id="product">
                    <option value="allProducts">All Products</option>
                    <option value="product1">Category 1</option>
                    <option value="product2">Category 2</option>
                    <option value="Product3">Category 3</option>
                    </select>
                    <select name="typeDropDown" id="type">
                    <option value="allTypes">All Types</option>
                    <option value="product1">Type 1</option>
                    <option value="product2">Type 2</option>
                    <option value="Product3">Type 3</option>
                    </select>
                </div>
            </div>


            <button class="record">
                + Record Movement
            </button>


        </div>
        <div class="box2">
          The table goes here
        </div>
    </main>

  </div>

</body>
</html>
